name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/ci.yml
  release:
    name: Sign, notarize and publish
    needs: checks
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout trusted tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        run: |
          python3 script/release_metadata.py --tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          xcodebuild -version
          brew install xcodegen
          mkdir -p .build/logs
      - name: Temporary signing keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./script/ci_signing.sh setup
      - name: Build and validate notarized distribution
        env:
          COMMANDER_UPDATE_KEY_FILE: ${{ runner.temp }}/commander-signing/sparkle.key
        run: ./script/ci_release.sh
      - name: Remove signing credentials
        if: always()
        run: ./script/ci_signing.sh cleanup
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 script/release_metadata.py --field version)"
          python3 script/update_feed.py verify --archive ".build/distribution/Commander4Mac-$VERSION.dmg" --feed .build/distribution/appcast.xml
          # Refuse an existing release rather than overwriting published bytes.
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "Commander4Mac $VERSION" \
            --notes-file .build/distribution/release-notes.md \
            ".build/distribution/Commander4Mac-$VERSION.dmg" \
            ".build/distribution/Commander4Mac-$VERSION.dmg.sha256" \
            .build/distribution/LGPL-Sources.tar.gz \
            .build/distribution/ThirdPartyNotices.txt \
            .build/distribution/appcast.xml
      - name: Release diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics-${{ github.ref_name }}
          path: |
            .build/logs/*.log
            .build/distribution/notarization/*.json
            .build/distribution/*.sha256
          retention-days: 14
          if-no-files-found: ignore
