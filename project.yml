name: Commander4Mac
options:
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
  UITest: debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 66LBY954DT
    CODE_SIGN_IDENTITY: Developer ID Application
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    UITest:
      ONLY_ACTIVE_ARCH: YES
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    revision: 90737c486c9d1a6ed1c1d4307060587c7bb0dfec
  Citadel:
    path: Vendor/Citadel
targets:
  CommanderCore:
    type: framework
    platform: macOS
    sources: [Sources/CommanderCore]
    dependencies:
      - package: Citadel
      - package: AMSMB2
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alanhuang.Commander4Mac.core
      DEFINES_MODULE: YES
      SKIP_INSTALL: YES
  Commander4Mac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Commander4Mac
      - path: Resources
        excludes: [OpenSource]
      - path: Resources/OpenSource
        type: folder
        buildPhase: resources
    dependencies:
      - target: CommanderCore
        embed: true
      - package: AMSMB2
        embed: true
    info:
      path: Configuration/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        NSDesktopFolderUsageDescription: Browse and organize files on your Desktop.
        NSDocumentsFolderUsageDescription: Browse and organize your documents.
        NSDownloadsFolderUsageDescription: Browse and organize your downloads.
        NSRemovableVolumesUsageDescription: Browse and organize files on removable drives.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connect to file servers on your local network.
        NSNetworkVolumesUsageDescription: Browse and organize files on mounted network drives.
    entitlements:
      path: Configuration/Commander4Mac.entitlements
      properties: {}
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Configuration/Commander4Mac.entitlements
      configs:
        Debug:
          PRODUCT_NAME: Commander4MacDev
          PRODUCT_BUNDLE_IDENTIFIER: com.alanhuang.Commander4Mac.dev
          APP_DISPLAY_NAME: Commander4Mac Dev
        Release:
          PRODUCT_NAME: Commander4Mac
          PRODUCT_BUNDLE_IDENTIFIER: com.alanhuang.Commander4Mac
          APP_DISPLAY_NAME: Commander4Mac
        UITest:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COMMANDER_UI_TEST_HOST"
          PRODUCT_NAME: Commander4MacUITestHost
          PRODUCT_BUNDLE_IDENTIFIER: com.alanhuang.Commander4Mac.uitest
          APP_DISPLAY_NAME: Commander4Mac UI Tests
  CommanderCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/CommanderCoreTests, Tests/Support]
    dependencies:
      - target: CommanderCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alanhuang.Commander4Mac.coretests
  Commander4MacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/Commander4MacUITests]
    dependencies:
      - target: Commander4Mac
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alanhuang.Commander4Mac.uitests
      TEST_TARGET_NAME: Commander4Mac
schemes:
  Commander4Mac:
    build:
      targets:
        Commander4Mac: all
        CommanderCoreTests: [test]
        Commander4MacUITests: [test]
    run:
      config: Debug
    test:
      config: UITest
      targets: [CommanderCoreTests, Commander4MacUITests]
    archive:
      config: Release
  CommanderCore:
    build:
      targets:
        CommanderCore: all
        CommanderCoreTests: [test]
    test:
      config: UITest
      targets: [CommanderCoreTests]
